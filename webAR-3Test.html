<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Holo Cube AR - Rear Camera</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; }
  
  /* REAR CAMERA: No scaleX(-1) mirroring */
  #cam { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; }
  
  /* Transparent WebGL Overlay */
  #gl  { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; }
  
  /* Status overlay */
  #msg { 
    position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom, 0px) + 28px); transform:translateX(-50%);
    padding:10px 18px; border-radius:20px; background:rgba(0,0,0,.75); color:#fff; font:500 14px/1.2 system-ui, sans-serif;
    pointer-events:none; opacity:0; transition:opacity .3s; white-space:nowrap; z-index: 10; text-align: center; 
  }
  #msg.show { opacity:1; }
</style>
</head>
<body>
<video id="cam" autoplay muted playsinline crossorigin="anonymous"></video>
<canvas id="gl"></canvas>
<div id="msg">Accessing Rear Camera...</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>

<script>
(() => {
'use strict';

/* ============================ CONFIG ============================ */
const EDGE       = 0.45;             // Cube edge length
const DIST       = 2.2;              // Cube distance
const FOV        = 50;
const MIN_SCALE  = 0.5;
const MAX_SCALE  = 1.8;
const PALETTE    = [0x00e5ff, 0x2979ff, 0xa855f7, 0xff3ea5, 0x22ff88].map(c => new THREE.Color(c));

/* ============================ HELPERS ============================ */
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp  = (a, b, t) => a + (b - a) * t;
const _c    = new THREE.Color();

function palette(t, out = _c) {
  const n = PALETTE.length;
  t = ((t % 1) + 1) % 1 * n;
  const i = Math.floor(t), f = t - i;
  return out.copy(PALETTE[i % n]).lerp(PALETTE[(i + 1) % n], f * f * (3 - 2 * f));
}

function glowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); 
  gr.addColorStop(0.3, 'rgba(255,255,255,0.35)'); 
  gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}

/* ============================ THREE.JS SCENE ============================ */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, powerPreference: 'high-performance' });
renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(FOV, 1, 0.1, 50);

function resize() {
  const W = window.innerWidth, H = window.innerHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(W, H, false);
  camera.aspect = W / H; 
  camera.updateMatrixWorld();
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

const root  = new THREE.Group();
const rotor = new THREE.Group();
root.position.set(0, 0, -DIST);
root.add(rotor); 
scene.add(root);

const tex  = glowTexture();
const half = EDGE / 2;

// Cube Geometry
const faceGeo = new THREE.BoxGeometry(EDGE, EDGE, EDGE, 6, 6, 6);
faceGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(faceGeo.attributes.position.count * 3), 3));
const faceMat = new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.2, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending });
rotor.add(new THREE.Mesh(faceGeo, faceMat));

// Edges
const edges = [];
for (let axis = 0; axis < 3; axis++) {
  for (let k = 0; k < 4; k++) {
    const a = (k & 1) ? half : -half, b = (k & 2) ? half : -half;
    const mk = (r, op) => {
      const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, EDGE + r * 2, 6, 1),
        new THREE.MeshBasicMaterial({ transparent: true, opacity: op, blending: THREE.AdditiveBlending, depthWrite: false }));
      if (axis === 0) { m.rotation.z = Math.PI / 2; m.position.set(0, a, b); }
      if (axis === 1) { m.position.set(a, 0, b); }
      if (axis === 2) { m.rotation.x = Math.PI / 2; m.position.set(a, b, 0); }
      rotor.add(m); return m;
    };
    edges.push({ core: mk(0.005, 0.95), glow: mk(0.016, 0.2), phase: edges.length / 12 });
  }
}

// Corners & Halo
const corners = [];
for (let i = 0; i < 8; i++) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.95 }));
  s.position.set((i & 1 ? half : -half), (i & 2 ? half : -half), (i & 4 ? half : -half));
  s.scale.setScalar(0.09);
  rotor.add(s); corners.push(s);
}

const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.15 }));
halo.scale.setScalar(EDGE * 2.6);
root.add(halo);

/* ============================ HAND TRACKING STATE ============================ */
const handState = { present: false, open: 0.5, px: 0, py: 0, vx: 0, vy: 0, lastTime: 0 };
let scaleCur = 1, scaleTarget = 1;
const rotVel = { x: 0, y: 0 };

function handOpenness(lm) {
  const d3 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y, (a.z - b.z) * 0.5);
  const palm = d3(lm[0], lm[9]) + d3(lm[0], lm[5]) * 0.5 + d3(lm[0], lm[17]) * 0.5;
  const tips = [4, 8, 12, 16, 20];
  let sum = 0;
  for (const t of tips) sum += d3(lm[t], lm[0]);
  const ratio = (sum / tips.length) / (palm / 2);
  return clamp((ratio - 1.0) / 0.9, 0, 1);
}

function onResults(res) {
  const now = performance.now() / 1000;
  const lm = res.multiHandLandmarks && res.multiHandLandmarks[0];

  if (!lm) {
    handState.present = false;
    return;
  }

  // UNMIRRORED coordinates for rear camera view
  const screenX = lm[9].x * window.innerWidth;
  const screenY = lm[9].y * window.innerHeight;

  if (handState.present) {
    const dt = Math.max(now - handState.lastTime, 0.01);
    const m = Math.min(window.innerWidth, window.innerHeight);
    handState.vx = lerp(handState.vx, ((screenX - handState.px) / m) / dt, 0.4);
    handState.vy = lerp(handState.vy, ((screenY - handState.py) / m) / dt, 0.4);
  } else {
    handState.vx = 0;
    handState.vy = 0;
  }

  handState.px = screenX;
  handState.py = screenY;
  handState.open = handOpenness(lm);
  handState.present = true;
  handState.lastTime = now;
}

/* ============================ RENDER LOOP ============================ */
let last = performance.now() / 1000;

function frame() {
  requestAnimationFrame(frame);
  const now = performance.now() / 1000;
  const dt = Math.min(now - last, 0.05); 
  last = now;

  if (handState.present) {
    scaleTarget = lerp(MIN_SCALE, MAX_SCALE, handState.open);
    rotVel.y = lerp(rotVel.y, clamp(handState.vx * 4, -6, 6), 1 - Math.exp(-dt * 10));
    rotVel.x = lerp(rotVel.x, clamp(handState.vy * 4, -6, 6), 1 - Math.exp(-dt * 10));
    handState.vx *= Math.exp(-dt * 6);
    handState.vy *= Math.exp(-dt * 6);
  } else {
    rotVel.x = lerp(rotVel.x, 0.08, 1 - Math.exp(-dt * 2));
    rotVel.y = lerp(rotVel.y, 0.2, 1 - Math.exp(-dt * 2));
  }

  scaleCur = lerp(scaleCur, scaleTarget, 1 - Math.exp(-dt * 8));
  root.scale.setScalar(scaleCur);

  rotor.rotation.x += rotVel.x * dt;
  rotor.rotation.y += rotVel.y * dt;

  const t = now;
  const pos = faceGeo.attributes.position, col = faceGeo.attributes.color;
  for (let i = 0; i < pos.count; i++) {
    palette(t * 0.1 + (pos.getX(i) + pos.getY(i) + pos.getZ(i)) / EDGE * 0.25, _c);
    col.setXYZ(i, _c.r, _c.g, _c.b);
  }
  col.needsUpdate = true;

  for (const e of edges) {
    palette(t * 0.1 + e.phase * 0.6, e.core.material.color);
    e.glow.material.color.copy(e.core.material.color);
  }

  renderer.render(scene, camera);
}
requestAnimationFrame(frame);

/* ============================ REAR CAMERA & AI SETUP ============================ */
const cam = document.getElementById('cam');
const msg = document.getElementById('msg');

function showMsg(text, ms = 3000) {
  msg.textContent = text;
  msg.classList.add('show');
  if (ms > 0) setTimeout(() => msg.classList.remove('show'), ms);
}

async function init() {
  try {
    // Force Rear Camera stream
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { 
        facingMode: { exact: 'environment' }, 
        width: { ideal: 1280 }, 
        height: { ideal: 720 } 
      },
      audio: false
    }).catch(async () => {
      // Fallback if 'exact' is rejected by desktop/emulator browsers
      return await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment' },
        audio: false
      });
    });

    cam.srcObject = stream;
    await cam.play();

    showMsg('Initializing AI Model...', 0);

    const hands = new Hands({
      locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 0,           // Speed boost on mobile chips
      minDetectionConfidence: 0.3,   // Reduced threshold for rear lighting conditions
      minTrackingConfidence: 0.3
    });

    hands.onResults(onResults);
    await hands.initialize();

    showMsg('Place hand in front of rear camera', 4000);

    let isProcessing = false;
    async function processFrame() {
      if (!isProcessing && cam.readyState >= 2) {
        isProcessing = true;
        try {
          await hands.send({ image: cam });
        } catch (e) {
          console.error("Tracking frame dropped:", e);
        }
        isProcessing = false;
      }
      requestAnimationFrame(processFrame);
    }
    processFrame();

  } catch (err) {
    console.error('Rear Camera Initialization Failed:', err);
    showMsg('Rear Camera permission denied or missing.', 0);
  }
}

window.addEventListener('load', init);
window.addEventListener('touchstart', () => { if (cam.paused && cam.srcObject) cam.play(); }, { passive: true });
})();
</script>
</body>
</html>
