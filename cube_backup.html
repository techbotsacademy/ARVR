<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>WebAR Cube on Hand</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    
    #video { 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
    }
    
    #canvas { 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      display: block; 
    }
    
    #status {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 12px 20px;
      border-radius: 20px;
      font-family: system-ui, sans-serif;
      font-size: 14px;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 100;
    }
    
    #status.show { opacity: 1; }
  </style>
</head>
<body>
  <video id="video" autoplay muted playsinline></video>
  <canvas id="canvas"></canvas>
  <div id="status"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>

  <script>
    'use strict';

    const CONFIG = {
      cubeSize: 0.4,
      cubeDistance: 2.0,
      cameraFOV: 50,
      colors: [0x00e5ff, 0x2979ff, 0xa855f7, 0xff3ea5, 0x22ff88]
    };

    const canvas = document.getElementById('canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setClearColor(0x000000, 0);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(CONFIG.cameraFOV, window.innerWidth / window.innerHeight, 0.1, 50);

    function onWindowResize() {
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    }

    window.addEventListener('resize', onWindowResize);
    onWindowResize();

    const cubeGroup = new THREE.Group();
    cubeGroup.position.z = -CONFIG.cubeDistance;
    scene.add(cubeGroup);

    const geometry = new THREE.BoxGeometry(CONFIG.cubeSize, CONFIG.cubeSize, CONFIG.cubeSize);
    const materials = CONFIG.colors.map(color => 
      new THREE.MeshBasicMaterial({
        color,
        transparent: true,
        opacity: 0.8,
        side: THREE.DoubleSide
      })
    );
    materials.push(new THREE.MeshBasicMaterial({ color: 0x111111, transparent: true, opacity: 0.8 }));

    const cube = new THREE.Mesh(geometry, materials);
    cubeGroup.add(cube);

    const edges = new THREE.EdgesGeometry(geometry);
    const wireframe = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x00e5ff, linewidth: 2 }));
    cubeGroup.add(wireframe);

    const videoEl = document.getElementById('video');
    const statusEl = document.getElementById('status');
    let hands = null;
    let handLandmarks = null;
    let isHandDetected = false;

    function showStatus(text, duration = 3000) {
      statusEl.textContent = text;
      statusEl.classList.add('show');
      if (duration > 0) {
        setTimeout(() => statusEl.classList.remove('show'), duration);
      }
    }

    function toScreenCoords(landmark) {
      const vw = videoEl.videoWidth || 640;
      const vh = videoEl.videoHeight || 480;
      const scale = Math.max(window.innerWidth / vw, window.innerHeight / vh);
      const x = landmark.x * vw * scale - (vw * scale - window.innerWidth) / 2;
      const y = landmark.y * vh * scale - (vh * scale - window.innerHeight) / 2;
      return { x, y };
    }

    function onHandResults(results) {
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        handLandmarks = results.multiHandLandmarks[0];
        isHandDetected = true;
      } else {
        handLandmarks = null;
        isHandDetected = false;
      }
    }

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });

        videoEl.srcObject = stream;

        await new Promise((resolve) => {
          videoEl.onloadedmetadata = () => {
            videoEl.play().catch(() => {});
            resolve();
          };
        });
      } catch (error) {
        console.error('Camera error:', error);
        showStatus('Camera access denied', 0);
        throw error;
      }
    }

    function waitForHands(maxAttempts = 100) {
      return new Promise((resolve, reject) => {
        let attempts = 0;
        const check = () => {
          if (typeof window.Hands !== 'undefined') {
            resolve();
          } else if (attempts < maxAttempts) {
            attempts += 1;
            setTimeout(check, 100);
          } else {
            reject(new Error('MediaPipe Hands failed to load on this device'));
          }
        };
        check();
      });
    }

    async function initHandTracking() {
      try {
        await waitForHands();

        hands = new window.Hands({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${file}`
        });

        hands.setOptions({
          maxNumHands: 1,
          modelComplexity: 1,
          minDetectionConfidence: 0.5,
          minTrackingConfidence: 0.5
        });

        hands.onResults(onHandResults);
        await hands.initialize();

        showStatus('Ready! Move your hand', 3000);

        let lastVideoTime = -1;
        const detectionLoop = async () => {
          if (videoEl.readyState >= 2 && videoEl.currentTime !== lastVideoTime) {
            lastVideoTime = videoEl.currentTime;
            try {
              await hands.send({ image: videoEl });
            } catch (e) {
              console.warn('Hand detection error:', e);
            }
          }
          requestAnimationFrame(detectionLoop);
        };

        detectionLoop();
      } catch (error) {
        console.error('Hand tracking error:', error);
        showStatus('Hand tracking failed', 0);
        throw error;
      }
    }

    let rotationX = 0;
    let rotationY = 0;

    function animate() {
      requestAnimationFrame(animate);

      rotationX += 0.01;
      rotationY += 0.02;
      cube.rotation.x = rotationX;
      cube.rotation.y = rotationY;
      wireframe.rotation.x = rotationX;
      wireframe.rotation.y = rotationY;

      if (isHandDetected && handLandmarks) {
        const palmCenter = toScreenCoords(handLandmarks[9]);
        const ndcX = (palmCenter.x / window.innerWidth) * 2 - 1;
        const ndcY = -(palmCenter.y / window.innerHeight) * 2 + 1;

        const vector = new THREE.Vector3(ndcX, ndcY, 0.5);
        vector.unproject(camera);
        vector.sub(camera.position).normalize();

        const targetPos = camera.position.clone().add(vector.multiplyScalar(CONFIG.cubeDistance));
        cubeGroup.position.x += (targetPos.x - cubeGroup.position.x) * 0.15;
        cubeGroup.position.y += (targetPos.y - cubeGroup.position.y) * 0.15;
      } else {
        cubeGroup.position.x += (0 - cubeGroup.position.x) * 0.1;
        cubeGroup.position.y += (0 - cubeGroup.position.y) * 0.1;
      }

      renderer.render(scene, camera);
    }

    async function init() {
      try {
        await initCamera();
        await initHandTracking();
        animate();
      } catch (error) {
        console.error('Initialization failed:', error);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && videoEl.paused && videoEl.srcObject) {
        videoEl.play().catch(() => {});
      }
    });
  </script>
</body>
</html>
