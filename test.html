<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Holo Cube WebAR Fix</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; }
  #cam { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; }
  #gl  { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; }
  #msg { 
    position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom, 0px) + 28px); transform:translateX(-50%);
    padding:10px 18px; border-radius:20px; background:rgba(0,0,0,.8); color:#fff; font:500 14px/1.2 system-ui, sans-serif;
    pointer-events:none; opacity:0; transition:opacity .3s; white-space:nowrap; z-index: 10; text-align: center; 
  }
  #msg.show { opacity:1; }
</style>
</head>
<body>
<video id="cam" autoplay muted playsinline crossorigin="anonymous"></video>
<canvas id="gl"></canvas>
<div id="msg">Initializing Camera...</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>

<script>
(() => {
'use strict';

/* ============================ CONFIG ============================ */
const EDGE       = 0.35;
const DIST       = 2.0;
const FOV        = 50;
const MIN_SCALE  = 0.3;
const MAX_SCALE  = 1.5;
const PALETTE    = [0x00e5ff, 0x2979ff, 0xa855f7, 0xff3ea5, 0x22ff88].map(c => new THREE.Color(c));

/* ============================ HELPERS ============================ */
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp  = (a, b, t) => a + (b - a) * t;
const _c    = new THREE.Color();

function palette(t, out = _c) {
  const n = PALETTE.length;
  t = ((t % 1) + 1) % 1 * n;
  const i = Math.floor(t), f = t - i;
  return out.copy(PALETTE[i % n]).lerp(PALETTE[(i + 1) % n], f * f * (3 - 2 * f));
}

function glowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); 
  gr.addColorStop(0.3, 'rgba(255,255,255,0.35)'); 
  gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}

/* ============================ THREE.JS SCENE ============================ */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, powerPreference: 'high-performance' });
renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(FOV, 1, 0.1, 50);

function resize() {
  const W = window.innerWidth, H = window.innerHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(W, H, false);
  camera.aspect = W / H; 
  camera.updateMatrixWorld();
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

const root  = new THREE.Group();
const rotor = new THREE.Group();
root.position.set(0, 0, -DIST);
root.add(rotor); 
scene.add(root);
root.visible = false; // Hide until hand detected

const tex  = glowTexture();
const half = EDGE / 2;

// Cube Geometry
const faceGeo = new THREE.BoxGeometry(EDGE, EDGE, EDGE, 6, 6, 6);
faceGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(faceGeo.attributes.position.count * 3), 3));
const faceMat = new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.3, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending });
rotor.add(new THREE.Mesh(faceGeo, faceMat));

// Edges
const edges = [];
for (let axis = 0; axis < 3; axis++) {
  for (let k = 0; k < 4; k++) {
    const a = (k & 1) ? half : -half, b = (k & 2) ? half : -half;
    const mk = (r, op) => {
      const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, EDGE + r * 2, 6, 1),
        new THREE.MeshBasicMaterial({ transparent: true, opacity: op, blending: THREE.AdditiveBlending, depthWrite: false }));
      if (axis === 0) { m.rotation.z = Math.PI / 2; m.position.set(0, a, b); }
      if (axis === 1) { m.position.set(a, 0, b); }
      if (axis === 2) { m.rotation.x = Math.PI / 2; m.position.set(a, b, 0); }
      rotor.add(m); return m;
    };
    edges.push({ core: mk(0.005, 0.95), glow: mk(0.016, 0.25), phase: edges.length / 12 });
  }
}

// Halo
const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.2 }));
halo.scale.setScalar(EDGE * 2.5);
root.add(halo);

/* ============================ HAND TRACKING STATE ============================ */
const handState = { present: false, open: 0.5, targetX: 0, targetY: 0, targetZ: -DIST, lastTime: 0 };
let scaleCur = 1, scaleTarget = 1;

function handOpenness(lm) {
  const d3 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y, (a.z - b.z) * 0.5);
  const palm = d3(lm[0], lm[9]) + d3(lm[0], lm[5]) * 0.5 + d3(lm[0], lm[17]) * 0.5;
  const tips = [4, 8, 12, 16, 20];
  let sum = 0;
  for (const t of tips) sum += d3(lm[t], lm[0]);
  const ratio = (sum / tips.length) / (palm / 2);
  return clamp((ratio - 1.0) / 0.9, 0, 1);
}

const handVector = new THREE.Vector3();

function onResults(res) {
  const now = performance.now() / 1000;
  const lm = res.multiHandLandmarks && res.multiHandLandmarks[0];

  if (!lm) {
    handState.present = false;
    return;
  }

  // Anchor to Palm Center (Landmark 9)
  const palmLandmark = lm[9];

  // Map 2D normalized landmark coordinates to 3D World Space
  const ndcX = (palmLandmark.x) * 2 - 1;
  const ndcY = -(palmLandmark.y) * 2 + 1;

  handVector.set(ndcX, ndcY, 0.5);
  handVector.unproject(camera);
  handVector.sub(camera.position).normalize();
  
  const targetWorldPos = camera.position.clone().add(handVector.multiplyScalar(DIST));

  handState.targetX = targetWorldPos.x;
  handState.targetY = targetWorldPos.y;
  handState.targetZ = targetWorldPos.z;
  handState.open = handOpenness(lm);
  handState.present = true;
  handState.lastTime = now;
}

/* ============================ RENDER LOOP ============================ */
let last = performance.now() / 1000;

function frame() {
  requestAnimationFrame(frame);
  const now = performance.now() / 1000;
  const dt = Math.min(now - last, 0.05); 
  last = now;

  if (handState.present && (now - handState.lastTime < 0.6)) {
    root.visible = true;

    // Direct Palm Tracking
    root.position.x = lerp(root.position.x, handState.targetX, 1 - Math.exp(-dt * 18));
    root.position.y = lerp(root.position.y, handState.targetY, 1 - Math.exp(-dt * 18));
    root.position.z = lerp(root.position.z, handState.targetZ, 1 - Math.exp(-dt * 18));

    // Dynamic Scaling on Finger Open/Close
    scaleTarget = lerp(MIN_SCALE, MAX_SCALE, handState.open);
    scaleCur = lerp(scaleCur, scaleTarget, 1 - Math.exp(-dt * 10));
    root.scale.setScalar(scaleCur);

    rotor.rotation.y += 0.5 * dt;
    rotor.rotation.x += 0.25 * dt;
  } else {
    root.visible = false;
  }

  // Color updates
  const t = now;
  const pos = faceGeo.attributes.position, col = faceGeo.attributes.color;
  for (let i = 0; i < pos.count; i++) {
    palette(t * 0.1 + (pos.getX(i) + pos.getY(i) + pos.getZ(i)) / EDGE * 0.25, _c);
    col.setXYZ(i, _c.r, _c.g, _c.b);
  }
  col.needsUpdate = true;

  renderer.render(scene, camera);
}
requestAnimationFrame(frame);

/* ============================ MOBILE COMPATIBLE ENGINE SETUP ============================ */
const cam = document.getElementById('cam');
const msg = document.getElementById('msg');

function showMsg(text, ms = 3000) {
  msg.textContent = text;
  msg.classList.add('show');
  if (ms > 0) setTimeout(() => msg.classList.remove('show'), ms);
}

async function init() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { 
        facingMode: 'environment', 
        width: { ideal: 640 }, 
        height: { ideal: 480 } 
      },
      audio: false
    });

    cam.srcObject = stream;
    await cam.play();

    showMsg('Starting Engine...', 0);

    const hands = new Hands({
      locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${file}`
    });

    // CRITICAL FOR MOBILE: Force CPU processing delegate to prevent WebGL GPU context loss
    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 0,
      minDetectionConfidence: 0.3,
      minTrackingConfidence: 0.3
    });

    hands.onResults(onResults);
    await hands.initialize();

    showMsg('Show your hand to render the cube', 3000);

    // Frame pump using createImageBitmap to prevent UI thread lockup on mobile Chrome
    let busy = false;
    async function processLoop() {
      if (!busy && cam.readyState >= 2) {
        busy = true;
        try {
          const bitmap = await createImageBitmap(cam);
          await hands.send({ image: bitmap });
          bitmap.close();
        } catch (e) {
          console.warn('Frame processing dropped:', e);
        }
        busy = false;
      }
      requestAnimationFrame(processLoop);
    }
    processLoop();

  } catch (err) {
    console.error('AR Init Error:', err);
    showMsg('Camera Initialization Failed', 0);
  }
}

window.addEventListener('load', init);
window.addEventListener('touchstart', () => { if (cam.paused && cam.srcObject) cam.play(); }, { passive: true });
})();
</script>
</body>
</html>
