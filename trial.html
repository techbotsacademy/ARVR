<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Mobile WebAR Hand Tracking</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    
    /* Layer 1: Camera Feed */
    #webcam {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Mirror view for front camera */
      z-index: 1;
    }
    
    /* Layer 2: 3D AR Canvas overlay */
    #ar-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    #loading {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-family: sans-serif;
      font-size: 16px;
      background: rgba(0,0,0,0.7);
      padding: 12px 24px;
      border-radius: 8px;
      z-index: 10;
    }
  </style>

  <!-- Import Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="loading">Initializing Camera & Worker...</div>
  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="ar-canvas"></canvas>

  <!-- Web Worker Script for Off-Thread MediaPipe Inference -->
  <script id="worker-code" type="js-worker">
    importScripts('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm/vision_bundle.js');

    let handLandmarker;
    let isProcessing = false;

    async function init() {
      const vision = await FilesetResolver.forVisionTasks(
        'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm'
      );
      
      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
          delegate: 'GPU'
        },
        runningMode: 'IMAGE',
        numHands: 1
      });

      postMessage({ type: 'READY' });
    }

    self.onmessage = async (e) => {
      if (e.data.type === 'INIT') {
        await init();
      } else if (e.data.type === 'PROCESS_FRAME') {
        if (!handLandmarker || isProcessing) return;
        
        isProcessing = true;
        const imageBitmap = e.data.imageBitmap;

        try {
          const results = handLandmarker.detect(imageBitmap);
          imageBitmap.close(); // Free GPU memory immediately

          if (results.landmarks && results.landmarks.length > 0) {
            // Send wrist (0) and index tip (8) landmarks back to main thread
            postMessage({
              type: 'RESULTS',
              wrist: results.landmarks[0][0],
              indexTip: results.landmarks[0][8]
            });
          } else {
            postMessage({ type: 'RESULTS', wrist: null });
          }
        } catch (err) {
          postMessage({ type: 'ERROR', error: err.message });
        } finally {
          isProcessing = false;
        }
      }
    };
  </script>

  <!-- Main Application Script -->
  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('ar-canvas');
    const loadingEl = document.getElementById('loading');

    let renderer, scene, camera, cube;
    let worker;
    let workerReady = false;
    let frameInFlight = false;

    // Initialize Three.js Scene with Orthographic projection for pixel-accurate placement
    function initThreeJS() {
      renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Cap pixel ratio to save thermal budget

      scene = new THREE.Scene();

      // Set up camera coordinates to match screen pixel space (0,0 top-left)
      camera = new THREE.OrthographicCamera(
        0, window.innerWidth,
        0, window.innerHeight,
        -1000, 1000
      );
      camera.position.z = 100;

      // Add 3D Cube
      const size = 60;
      const geometry = new THREE.BoxGeometry(size, size, size);
      const materials = [
        new THREE.MeshBasicMaterial({ color: 0xff0000 }),
        new THREE.MeshBasicMaterial({ color: 0x00ff00 }),
        new THREE.MeshBasicMaterial({ color: 0x0000ff }),
        new THREE.MeshBasicMaterial({ color: 0xffff00 }),
        new THREE.MeshBasicMaterial({ color: 0x00ffff }),
        new THREE.MeshBasicMaterial({ color: 0xff00ff })
      ];

      cube = new THREE.Mesh(geometry, materials);
      cube.visible = false; // Hide until hand detected
      scene.add(cube);

      window.addEventListener('resize', onWindowResize);
    }

    function onWindowResize() {
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.right = window.innerWidth;
      camera.bottom = window.innerHeight;
      camera.updateProjectionMatrix();
    }

    // Camera Access Setup
    async function initCamera() {
      const constraints = {
        video: {
          facingMode: 'user',
          width: { ideal: 640 },
          height: { ideal: 480 }
        },
        audio: false
      };

      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = stream;
      
      return new Promise((resolve) => {
        video.onloadedmetadata = () => {
          video.play();
          resolve();
        };
      });
    }

    // Web Worker Setup
    function initWorker() {
      const blob = new Blob([document.getElementById('worker-code').textContent], { type: 'text/javascript' });
      worker = new Worker(URL.createObjectURL(blob));

      worker.onmessage = (e) => {
        if (e.data.type === 'READY') {
          workerReady = true;
          loadingEl.style.display = 'none';
        } else if (e.data.type === 'RESULTS') {
          frameInFlight = false;
          updateAROverlay(e.data.wrist, e.data.indexTip);
        }
      };

      worker.postMessage({ type: 'INIT' });
    }

    // Map Normalized Video Coordinates (0.0–1.0) to Screen Overlay Pixels
    function updateAROverlay(wrist, indexTip) {
      if (!wrist) {
        cube.visible = false;
        return;
      }

      cube.visible = true;

      const screenW = window.innerWidth;
      const screenH = window.innerHeight;
      const videoW = video.videoWidth;
      const videoH = video.videoHeight;

      // Calculate object-fit: cover scaling offset ratios
      const screenAspect = screenW / screenH;
      const videoAspect = videoW / videoH;

      let renderW, renderH, offsetX = 0, offsetY = 0;

      if (screenAspect > videoAspect) {
        renderW = screenW;
        renderH = screenW / videoAspect;
        offsetY = (renderH - screenH) / 2;
      } else {
        renderH = screenH;
        renderW = screenH * videoAspect;
        offsetX = (renderW - screenW) / 2;
      }

      // Convert MediaPipe X (mirrored for front camera) & Y to Screen Pixels
      const pixelX = (1 - wrist.x) * renderW - offsetX;
      const pixelY = wrist.y * renderH - offsetY;

      // Update 3D Cube Position
      cube.position.set(pixelX, pixelY, 0);

      // Optional: Rotate cube using vector from wrist to index tip
      if (indexTip) {
        const tipX = (1 - indexTip.x) * renderW - offsetX;
        const tipY = indexTip.y * renderH - offsetY;
        const angle = Math.atan2(tipY - pixelY, tipX - pixelX);
        cube.rotation.z = angle;
        cube.rotation.x += 0.02; // Slow turn for 3D depth effect
      }
    }

    // Render loop with dynamic frame dispatching
    function animate() {
      requestAnimationFrame(animate);

      // Pass frames to worker only when ready and idle (Backpressure prevention)
      if (workerReady && !frameInFlight && video.readyState === 4) {
        frameInFlight = true;
        createImageBitmap(video).then((imageBitmap) => {
          worker.postMessage({ type: 'PROCESS_FRAME', imageBitmap }, [imageBitmap]);
        }).catch(() => {
          frameInFlight = false;
        });
      }

      renderer.render(scene, camera);
    }

    // Application Entry
    async function start() {
      try {
        initThreeJS();
        await initCamera();
        initWorker();
        animate();
      } catch (err) {
        loadingEl.innerText = 'Error starting WebAR: ' + err.message;
        console.error(err);
      }
    }

    start();
  </script>
</body>
</html>
